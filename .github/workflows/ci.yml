name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Smoke test the CLI on the sample inventory
        run: |
          cloudguard list-checks
          cloudguard scan --inventory examples/sample_inventory.json --format sarif -o results.sarif
          cloudguard scan --inventory examples/sample_inventory_aws.json --format json -o aws.json
          cloudguard scan --iac examples/terraform --format sarif -o iac.sarif
      - name: Keep the SARIF output
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-sarif
          path: results.sarif

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudguard:ci .
      - run: docker run --rm cloudguard:ci list-checks
      - run: docker run --rm -v "$PWD/examples:/data" cloudguard:ci scan --iac /data/terraform
