name: CloudGuard scan

# Scans the intentionally insecure demo Terraform in examples/ with CloudGuard itself and
# uploads the SARIF report, so the findings show up in the repository's Security tab.
# To scan your own infrastructure, change the path after --iac.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[iac]"
      - name: Scan Terraform
        run: cloudguard scan --iac examples/terraform --format sarif -o cloudguard.sarif
      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cloudguard.sarif
          category: cloudguard-iac
